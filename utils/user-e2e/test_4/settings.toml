# Test 4: large-vol-slippery-single
[settings.general]
protocol_name = "large-vol-slippery-single"
mode = "single_X1"
starting_tip_well = "H1"
tip_reuse = "never"

[settings.general.head_speed]
speed = 200

[settings.liquid_handling]
active_preset = ""

[settings.liquid_handling.pre_aspirate_contact]
enabled = true
position_offset_percent = 20
aspirate_volume = 20

[settings.liquid_handling.post_aspirate_wick]
enabled = true
radius = 0.8
v_offset_mm = -1.5
speed = 20

[settings.liquid_handling.delays]
post_aspirate = 0

[settings.liquid_handling.push_out]
enabled = false

[settings.liquid_handling.mixing]
enabled = false
location = "destination"
repetitions = 3
source_remixing = "once"

[[settings.working_plate]]
type = "source"
labware_id = "tube_rack_24_4000ul"
position_rack = "1"

[[settings.working_plate]]
type = "destination"
labware_id = "tube_rack_96_2000ul"
position_rack = "3"

[[settings.working_plate]]
type = "tip"
labware_id = "tip_rack_geb_1000ul"
connection = "Pipette_1"
position_rack = "6"
