# =============================================================================
# Labware definitions - categorized by type using table arrays
# Each labware item specifies its category, properties, and optional calibration offsets
# =============================================================================

# LABWARE CALIBRATION OFFSETS - ⚠️ NOT RECOMMENDED
#
# ⚠️ IMPORTANT: Calibration offsets are position-dependent (vary by deck slot),
# NOT just labware-dependent. Defining offsets here applies them to ALL instances
# of that labware type regardless of deck position, which can cause problems.
#
# RECOMMENDED APPROACH: Use the Opentrons App's "Labware Position Check" feature
# during protocol setup. This allows position-specific calibration that the robot
# saves and reuses automatically (v6.0.0+).
#
# OFFSET FIELDS (all optional, units in millimeters):
# - offset_x: X-axis offset (positive = move right, negative = move left)
# - offset_y: Y-axis offset (positive = move toward back, negative = move toward front)
# - offset_z: Z-axis offset (positive = move up, negative = move down)
#
# COORDINATE SYSTEM:
# - X-axis: Left(-) ←→ Right(+)
# - Y-axis: Front(-) ←→ Back(+)
# - Z-axis: Down(-) ←→ Up(+)
#
# WHY OFFSETS HERE ARE RISKY:
# - Same labware in different deck slots may need different offsets
# - Deck slots have manufacturing variations and uneven surfaces
# - Applying one offset to all positions can cause misalignment
#
# WHEN OFFSETS HERE MIGHT BE ACCEPTABLE:
# - You only use one instance of each labware type per protocol
# - You've verified the offset works for all positions you use
# - You need embedded offsets for automation purposes
#
# EXAMPLE (use with caution):
# [[labware]]
# category = "tube_rack"
# labware_id = "tube_rack_96_1500ul"
# well_count = 96
# well_volume = 1500
# # This labware type needs slight positioning adjustment
# offset_x = 0.15    # Move 0.15mm to the right
# offset_y = -0.1    # Move 0.1mm toward front
# offset_z = 0.05    # Move 0.05mm higher

