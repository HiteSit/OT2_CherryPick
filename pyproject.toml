[project]
name = "OT2_CherryPick"
version = "1.6.2"
description = "Automated Cherry-Pick for OT2 using MCP and FastMCP integration"
authors = [
    { name = "Riccardo Fusco", email = "riccardofusco99@gmail.com" }
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
keywords = ["opentrons", "ot-2", "liquid-handling", "cherry-pick", "mcp", "laboratory-automation", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp-use>=1.3.7,<2",
    "langchain-mistralai>=0.2.12,<0.3",
    "numpy>=1.20.0,<2",
    "pandas>=2.3.3,<3",
    "rdkit>=2025.9.1,<2026",
    "seaborn>=0.13.2,<0.14",
    "datamol>=0.12.5,<0.13",
    "toml>=0.10.2,<0.11",
    "tomli>=2.3.0,<3",
    "tomlkit>=0.13.3,<0.14",
    "fastmcp>=2.3.0",
    "mcp>=1.8.0",
    "mols2grid>=2.0.0",
    "jupyterlab>=4.4.9",
    "pytest>=8.4.2,<9",
    "fastapi>=0.121.1",
    "uvicorn>=0.38.0",
    "markdown>=3.10",
]

[project.urls]
Homepage = "https://github.com/HiteSit/OT2_CherryPick"
Repository = "https://github.com/HiteSit/OT2_CherryPick"
"Bug Tracker" = "https://github.com/HiteSit/OT2_CherryPick/issues"
Documentation = "https://github.com/HiteSit/OT2_CherryPick#documentation"

[project.scripts]
ot2-mcp-server = "ot2_cherrypick_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src/ot2_cherrypick_mcp" ]

[tool.pytest.ini_options]
# Pytest configuration for OT2_CherryPick test suite

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test paths
testpaths = [
    "tests/workflow",
    "tests/e2e",
    "tests/fastapi",
    "tests/unit",
    "tests/integration",
    "tests",
]

# Markers for organizing tests
markers = [
    "requires_simulation: Tests that require opentrons_simulate and labware definitions",
    "pipeline_test: Tests suitable for CI/CD pipeline execution",
    "slow: Tests that take significant time to execute",
    "baseline_test: Tests that validate captured baseline fixtures",
    "e2e: End-to-end integration tests",
    "unit: Unit tests",
    "integration: Integration tests",
    "fastapi: FastAPI backend tests",
    "workflow: Unified workflow tests (Phase 3)",
    "error_scenario: Tests for error handling scenarios",
    "resource_test: Tests for MCP resource endpoints",
]

# Output options
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.uv]
managed = true
