# Labware Position Offset Database
# Maps labware_id + slot position → calibration offsets (x, y, z in mm)
# Offsets accumulate over time from calibration runs
#
# Each entry records the offset for a specific labware in a specific deck slot.
# The combination of labware_id + position_rack is the unique key.
#
# Fields:
#   labware_id     - Opentrons labware load name (must match settings.toml working_plate)
#   position_rack  - OT-2 deck slot number (1-11)
#   offset_x       - X offset in mm (negative=left, positive=right)
#   offset_y       - Y offset in mm (negative=front, positive=back)
#   offset_z       - Z offset in mm (negative=down, positive=up)
#   last_calibrated - Date of last calibration (YYYY-MM-DD, optional)
#   notes          - Free-text notes about calibration (optional)
