# =============================================================================
# Unified Cherry-Pick Protocol Settings (CherryPick_OT)
# =============================================================================
# This configuration file contains physical liquid handling parameters that can
# be combined to handle different liquid types without protocol-specific changes.

# General Protocol Settings
[settings.general]
mode = "single_X1"              # Options: "single_X1", "multi_X1", "multi", "dual"
                                # "dual" enables multi-pipette mode (CSV Mode column required)
starting_tip_well = "H1"        # Starting well for multi_X1 mode (single tip from 8-channel)

# Head Speed Configuration
[settings.general.head_speed]
speed = 400                     # Pipette movement speed (mm/min)

# =============================================================================
# LIQUID HANDLING PARAMETERS
# =============================================================================
# These physical parameters can be combined to handle different liquid types:
# - Standard aqueous: contact only, no delays
# - Viscous (DMSO-like): contact + delays + push-out
# - Hydrophobic/slippery: contact + pre-wet volume
# - High precision: contact + tip wick only

[settings.liquid_handling]

# Pre-Aspirate Liquid Contact
# Combines touch_liquid and pre_wet functionality from original protocols
[settings.liquid_handling.pre_aspirate_contact]
enabled = false                 # Enable liquid contact before aspiration
position_offset_percent = 20    # How much higher/safer from CSV position (%)
                                # For "Source Height": adds 20% more height (safer)
                                # For "Source Top": moves 20% closer to top (safer)
aspirate_volume = 20            # µL to aspirate/dispense for tip conditioning
                                # 0 = touch only (like standard/DMSO protocols)
                                # >0 = pre-wet mode (like slippery protocol)

# Post-Aspirate Tip Wicking
# Removes residual droplets after aspiration (universal across all protocols)
[settings.liquid_handling.post_aspirate_wick]
enabled = false                 # Enable tip wicking after aspiration
radius = 1                      # Touch tip radius
v_offset_mm = -1.5              # Vertical offset from well top (mm)
speed = 20                      # Touch tip speed

# Timing Delays
# For viscous liquids that need settling time
[settings.liquid_handling.delays]
post_aspirate = 0               # Seconds to wait after aspiration
                                # 0 = no delay (standard/slippery)
                                # 2.0 = DMSO-style delay for viscous liquids

# Dispense Enhancements
# For complete liquid ejection from viscous samples
[settings.liquid_handling.push_out]
enabled = true                   # Enable push-out during dispense
volume_ul = 20                   # Fixed push-out volume in µL
                                 # Only applies when no mixing follows

# Mixing Configuration
# Controls WHERE and WHEN mixing occurs during transfers
[settings.liquid_handling.mixing]
enabled = false                 # Master switch - set to true to enable mixing functionality
location = "destination"        # Options: "destination", "source", "none" (only used if enabled = true)
                                # "destination": Mix after dispensing (default, current behavior)
                                #                Use for: dilutions, reagent addition, compound screening
                                # "source": Mix before aspirating (resuspends stock before sampling)
                                #          Use for: cell suspensions, bead resuspension, glycerol stocks
                                # "none": Disable mixing even if CSV specifies Mix Volume
                                #        Use for: protocols where mixing causes issues (fragile samples)

repetitions = 2                 # Number of mixing cycles (aspirate/dispense repetitions)
                                # Typical: 3-5 for most applications
                                # Lower (1-2): Gentle mixing for fragile samples
                                # Higher (5-10): Thorough mixing for viscous or settling samples

source_remixing = "once"        # Options: "once", "always" (only applies when location="source")
                                # "once": Mix each unique source well only before first transfer
                                #        Assumes source remains homogeneous between transfers (~seconds)
                                #        Faster, recommended for most applications
                                # "always": Re-mix source before every transfer from same well
                                #          Use for: fast-settling suspensions (cells, beads with <10s settling time)

# NOTE: CSV columns "Mix Volume" and "Mix Height" interpretation depends on location:
#   - location = "source": Mix Volume/Height applied to SOURCE well before aspiration
#   - location = "destination": Mix Volume/Height applied to DESTINATION well after dispense
#   - location = "none": Mix Volume and Mix Height columns ignored entirely

# =============================================================================
# PRESET CONFIGURATIONS
# =============================================================================
# Common combinations for different liquid handling scenarios.
# Copy these values to the main sections above to apply presets.

# Standard Aqueous Solutions (like original cherry_pick_protocol.py)
# Light liquid contact for positioning confidence + tip wick
[settings.liquid_handling.presets.standard]
pre_aspirate_contact = { enabled = true, position_offset_percent = 20, aspirate_volume = 0 }
post_aspirate_wick = { enabled = true, radius = 0.8, v_offset_mm = -1.5, speed = 20 }
delays = { post_aspirate = 0 }
push_out = { enabled = false }
mixing = { enabled = true, location = "destination", repetitions = 3, source_remixing = "once" }

# Viscous Liquids (like original cherry_pick_protocol_DMSO.py)
# Contact + delays for settling + push-out for complete ejection
[settings.liquid_handling.presets.viscous]
pre_aspirate_contact = { enabled = true, position_offset_percent = 20, aspirate_volume = 0 }
post_aspirate_wick = { enabled = true, radius = 0.8, v_offset_mm = -1.5, speed = 20 }
delays = { post_aspirate = 2.0 }
push_out = { enabled = true, volume_ul = 5 }
mixing = { enabled = true, location = "destination", repetitions = 5, source_remixing = "once" }

# Hydrophobic/Slippery Liquids (like original cherrypick_slipery.py)
# Pre-wet tip conditioning + standard handling
[settings.liquid_handling.presets.slippery]
pre_aspirate_contact = { enabled = true, position_offset_percent = 20, aspirate_volume = 5 }
post_aspirate_wick = { enabled = true, radius = 0.8, v_offset_mm = -1.5, speed = 20 }
delays = { post_aspirate = 0 }
push_out = { enabled = false }
mixing = { enabled = true, location = "destination", repetitions = 3, source_remixing = "once" }

# High Precision Mode
# Minimal interventions, maximum precision
[settings.liquid_handling.presets.minimal]
pre_aspirate_contact = { enabled = false }
post_aspirate_wick = { enabled = true, radius = 0.8, v_offset_mm = -1.5, speed = 20 }
delays = { post_aspirate = 0 }
push_out = { enabled = false }
mixing = { enabled = true, location = "destination", repetitions = 3, source_remixing = "once" }

# Aggressive Handling
# All features enabled for challenging liquids
[settings.liquid_handling.presets.aggressive]
pre_aspirate_contact = { enabled = true, position_offset_percent = 30, aspirate_volume = 10 }
post_aspirate_wick = { enabled = true, radius = 0.8, v_offset_mm = -1.5, speed = 15 }
delays = { post_aspirate = 3.0 }
push_out = { enabled = true, volume_ul = 5 }
mixing = { enabled = true, location = "destination", repetitions = 7, source_remixing = "once" }

# Cell Resuspension / Bead Mixing
# Mix source wells before sampling to ensure homogeneous suspensions
[settings.liquid_handling.presets.cell_resuspension]
pre_aspirate_contact = { enabled = true, position_offset_percent = 20, aspirate_volume = 0 }
post_aspirate_wick = { enabled = true, radius = 0.8, v_offset_mm = -1.5, speed = 20 }
delays = { post_aspirate = 0 }
push_out = { enabled = false }
mixing = { enabled = true, location = "source", repetitions = 5, source_remixing = "once" }  # Mix at source before aspirating

# =============================================================================
# DECK LAYOUT CONFIGURATION
# =============================================================================

# Deck layout configuration - specify which labware goes in which slots
# Labware calibration offsets are now defined in labware_dict.toml for each labware type

[[settings.working_plate]]
type = "module"
module_type = "heaterShaker"
position_rack = "10"
adapter_id = "opentrons_universal_flat_adapter"
labware_id = ""
target_temperature = 0
target_shake_speed = 0
persist_after_protocol = true        # Keep running after protocol ends

[[settings.working_plate]]
type = "reservoir"
labware_id = "384_ppv_55ul"
position_rack = "2"

[[settings.working_plate]]
type = "reservoir"
labware_id = "tube_rack_96_1500ul"
position_rack = "4"

# =============================================================================
# TIP RACK ALLOCATION FOR DUAL-PIPETTE MODE
# =============================================================================
# CRITICAL: Each mode needs its own tip rack(s) to avoid consumption conflicts!
# - 'multi' mode: Pipette_8 uses ALL 8 nozzles (consumes full columns)
# - 'multi_X1' mode: Pipette_8 uses SINGLE nozzle (consumes scattered tips)
# - 'single_X1' mode: Pipette_1 single-channel (consumes scattered tips)

# Tip rack for Pipette_8 in MULTI mode (full 8-channel operation)
[[settings.working_plate]]
type = "tip"
labware_id = "opentrons_96_tiprack_300ul"
connection = "Pipette_8"
mode = "multi"  # Used when CSV specifies Mode="multi"
position_rack = "1"

# Tip rack for Pipette_8 in MULTI_X1 mode (single-tip from 8-channel)
[[settings.working_plate]]
type = "tip"
labware_id = "opentrons_96_tiprack_300ul"
connection = "Pipette_8"
mode = "multi_X1"  # Used when CSV specifies Mode="multi_X1"
position_rack = "3"

# Tip rack for Pipette_1 in SINGLE_X1 mode (dedicated single-channel)
[[settings.working_plate]]
type = "tip"
labware_id = "tip_rack_geb_1000ul"
connection = "Pipette_1"
mode = "single_X1"  # Used when CSV specifies Mode="single_X1"
position_rack = "9"  # Moved to slot 9 to avoid collision with multi_X1 pipette (top-right position)

# =============================================================================
# HARDWARE MODULES (OPTIONAL)
# =============================================================================
# Hardware modules like heater-shaker provide environmental control but do NOT
# participate in liquid transfers. Modules are "background-only" - CSV transfers
# cannot reference module labware as source or destination.
#
# HEATER-SHAKER MODULE:
# The heater-shaker provides temperature control (37-95°C) and orbital shaking
# (200-3000 RPM) for maintaining optimal reaction conditions during protocols.
#
# KEY BEHAVIORS:
# - Initializes at protocol start (non-blocking temperature, blocking shake)
# - Temperature ramps in background while transfers execute (parallel operation)
# - Shaking initialization blocks ~5-10 seconds (acceptable for setup)
# - Latch remains CLOSED throughout protocol (no pipetting access to module plate)
# - Labware on module is for manual sample prep only (not CSV-accessible)
# - Module slot is marked as occupied (deck conflict detection applies)
#
# CONFIGURATION FIELDS:
# - type: Must be "module" to identify as hardware module
# - module_type: "heaterShaker" (only supported module currently)
# - position_rack: Deck slot (OT-2: slots 1,3,4,6,7,10; avoid adjacent tall labware)
# - adapter_id: Adapter loaded on module (required for labware mounting)
# - labware_id: Labware loaded on adapter (standard Opentrons labware ID)
# - target_temperature: Temperature in °C (0 = disabled, 37-95 = active, MUST be explicit)
# - target_shake_speed: Shake speed in RPM (0 = disabled, 200-3000 = active, MUST be explicit)
# - persist_after_protocol: If true, module continues running after protocol ends
#                          If false, module deactivates immediately (heater off, shaker off)
#
# IMPORTANT CONSTRAINTS:
# - Module labware is NEVER referenced in CSV (background-only)
# - Set target_temperature = 0 to disable heating (explicit required)
# - Set target_shake_speed = 0 to disable shaking (explicit required)
# - Cannot pipette to/from module labware (latch remains closed)
# - Module slot counts as occupied (include in deck layout planning)
#
# EXAMPLE CONFIGURATIONS:
#
# Example 1: Full heater-shaker (heating + shaking, persist after protocol)
# [[settings.working_plate]]
# type = "module"
# module_type = "heaterShaker"
# position_rack = "7"
# adapter_id = "opentrons_96_flat_bottom_adapter"
# labware_id = "nest_96_wellplate_200ul_flat"
# target_temperature = 37              # 37°C (physiological temperature)
# target_shake_speed = 300             # 300 RPM (gentle mixing)
# persist_after_protocol = true        # Keep running after protocol ends
#
# Example 2: Heating only (no shaking, deactivate after protocol)
# [[settings.working_plate]]
# type = "module"
# module_type = "heaterShaker"
# position_rack = "7"
# adapter_id = "opentrons_96_flat_bottom_adapter"
# labware_id = "nest_96_wellplate_200ul_flat"
# target_temperature = 42              # 42°C (elevated temperature)
# target_shake_speed = 0               # No shaking (MUST be explicit)
# persist_after_protocol = false       # Deactivate at protocol end
#
# Example 3: Shaking only (no heating, persist after protocol)
# [[settings.working_plate]]
# type = "module"
# module_type = "heaterShaker"
# position_rack = "7"
# adapter_id = "opentrons_96_flat_bottom_adapter"
# labware_id = "nest_96_wellplate_200ul_flat"
# target_temperature = 0               # No heating (MUST be explicit)
# target_shake_speed = 500             # 500 RPM (moderate agitation)
# persist_after_protocol = true        # Keep shaking after protocol ends

# =============================================================================
# CSV COLUMN DOCUMENTATION
# =============================================================================
# Complete reference for all available CSV columns in cherry-pick transfers

# REQUIRED COLUMNS (must be present in every CSV):
# - "Source Labware": Name of source labware (e.g., "iqb_96_tuberack_2000ul_4")
# - "Source Well": Source well position (e.g., "A1", "H12")
# - "Volume (ul)": Transfer volume in microliters (e.g., 50, 100.5)
# - "Dest Labware": Name of destination labware (e.g., "pp_384_wellplate_150_ul_high_2")
# - "Dest Well": Destination well position (e.g., "B1", "P24")

# POSITIONING COLUMNS (choose ONE for source, ONE for destination):
# Source positioning - specify EITHER Source Height OR Source Top (not both):
# - "Source Height": Offset from well bottom in mm (e.g., 2, 1.5, 0.5)
#                   Positive = higher from bottom, 0 = at bottom
# - "Source Top": Offset from well top in mm (e.g., -5, -2.0, -10)
#                Negative = down from top, 0 = at top surface
#
# Destination positioning - specify EITHER Dest Height OR Dest Top (not both):
# - "Dest Height": Offset from well bottom in mm (e.g., 1, 2.5)
# - "Dest Top": Offset from well top in mm (e.g., -3, -7.5)
#
# Mixing positioning (optional, only used if Mix Volume > 0):
# - "Mix Height": Offset from well bottom for mixing (e.g., 2.0, 5.0)
#                Context-dependent on [settings.liquid_handling.mixing].location:
#                  - location="destination": Mix Height in DESTINATION well
#                  - location="source": Mix Height in SOURCE well
#                Default: 2.0mm if not specified

# LIQUID HANDLING COLUMNS (all optional, defaults applied if missing):
# - "Mix Volume": Volume in µL for mixing (e.g., 20, 50, 150)
#                0 = no mixing, >0 = mix 3 times with specified volume
#                WHERE mixing occurs depends on [settings.liquid_handling.mixing].location:
#                  - location="destination": Mix AFTER dispensing (default behavior)
#                  - location="source": Mix BEFORE aspirating (for cell suspensions, beads)
#                  - location="none": Mix Volume ignored entirely
#                Default: 0 (no mixing)
#
# - "Flow Aspirate": Aspirate rate multiplier (e.g., 0.5, 1.0, 1.5)
#                   1.0 = normal speed, <1.0 = slower, >1.0 = faster
#                   Default: 1.0
#
# - "Flow Dispense": Dispense rate multiplier (e.g., 0.8, 1.2, 2.0)
#                   1.0 = normal speed, <1.0 = slower, >1.0 = faster
#                   Default: 1.0
#
# - "Air Gap": Air gap volume in µL (e.g., 5, 10, 20)
#             0 = no air gap, >0 = aspirate air after liquid
#             Prevents dripping during transport
#             Default: 0
#
# - "Air Gap Rate": Air gap aspiration rate multiplier (e.g., 0.5, 1.0)
#                  Only applies if Air Gap > 0
#                  Default: 1.0

# TIP MANAGEMENT COLUMN (REQUIRED):
# - "Tip Action": Per-transfer tip behavior - MUST be specified for each row
#    - "new": Always get new tip (drop current if present, pick up fresh)
#    - "keep": Keep current tip (pick up new only if none present)
#             NOTE: Not supported in multi_X1 mode (auto-converts to 'drop')
#    - "drop": Use tip for transfer then drop it immediately after

# CSV EXAMPLES:
# Basic CSV (minimal required columns):
# Source Labware,Source Well,Volume (ul),Dest Labware,Dest Well,Source Height,Dest Top,Tip Action
# tube_rack_1,A1,50,plate_2,B1,2,-5,new
#
# Advanced CSV (all features):
# Source Labware,Source Well,Volume (ul),Dest Labware,Dest Well,Source Height,Dest Top,Mix Volume,Flow Aspirate,Flow Dispense,Air Gap,Tip Action
# tube_rack_1,A1,100,plate_2,B1,2,-5,20,0.5,1.2,10,new
# tube_rack_1,A2,50,plate_2,B2,2,-5,0,0.8,1.0,0,keep