services:
  # FastAPI Backend
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-latest}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ghcr.io/hitesit/ot2-cherrypick/backend:${APP_VERSION:-latest}
    container_name: ot2-cherrypick-backend
    environment:
      OT2_GUI_WORKSPACE: ${OT2_GUI_WORKSPACE}
      OT2_PROJECT_DIR: ${OT2_PROJECT_DIR}
      COMPUTER_ID: ${COMPUTER_ID}
      PYTHONUNBUFFERED: "1"
      # Opentrons App data directory (contains labware/ and protocols/ subdirs)
      # REQUIRED: Must be set in .env file
      OPENTRONS_DIR: ${OPENTRONS_DIR_MOUNT}
    volumes:
      # Persist gui_state workspace across container restarts
      - gui_state:/app/gui_state
      # Mount logs for debugging
      - logs:/app/logs
      # Mount Opentrons App data directory from host (labware + protocols)
      # REQUIRED: Set OPENTRONS_DIR_HOST and OPENTRONS_DIR_MOUNT in .env file
      - ${OPENTRONS_DIR_HOST}:${OPENTRONS_DIR_MOUNT}
    networks:
      - ot2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/settings')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Nginx Reverse Proxy + Frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        APP_VERSION: ${APP_VERSION:-latest}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ghcr.io/hitesit/ot2-cherrypick/frontend:${APP_VERSION:-latest}
    container_name: ot2-cherrypick-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-80}:80"
    networks:
      - ot2-network
    restart: unless-stopped

volumes:
  # Persistent storage for configuration and CSVs
  gui_state:
    driver: local
  # Persistent storage for logs
  logs:
    driver: local

networks:
  ot2-network:
    driver: bridge
