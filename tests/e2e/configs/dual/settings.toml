# Dual-pipette mode configuration for e2e tests
# Enables mid-protocol switching between pipettes based on CSV Mode column

[settings.general]
tip_reuse = "always"
mode = "dual"
starting_tip_well = "H1"

[settings.general.head_speed]
speed = 400

[settings.liquid_handling]

[settings.liquid_handling.pre_aspirate_contact]
enabled = false
position_offset_percent = 20
aspirate_volume = 0

[settings.liquid_handling.post_aspirate_wick]
enabled = false
radius = 1
v_offset_mm = -1.5
speed = 20

[settings.liquid_handling.delays]
post_aspirate = 0

[settings.liquid_handling.push_out]
enabled = true
volume_ul = 5

[settings.liquid_handling.mixing]
location = "none"
repetitions = 3
source_remixing = "once"

# Deck layout for dual-pipette mode
[[settings.working_plate]]
type = "reservoir"
labware_id = "384_ppv_55ul"
position_rack = "2"

[[settings.working_plate]]
type = "reservoir"
labware_id = "tube_rack_96_1500ul"
position_rack = "4"

# Tip rack for Pipette_8 in MULTI mode (full 8-channel)
[[settings.working_plate]]
type = "tip"
labware_id = "opentrons_96_tiprack_300ul"
connection = "Pipette_8"
mode = "multi"
position_rack = "1"

# Tip rack for Pipette_8 in MULTI_X1 mode (single-tip from 8-channel)
[[settings.working_plate]]
type = "tip"
labware_id = "opentrons_96_tiprack_300ul"
connection = "Pipette_8"
mode = "multi_X1"
position_rack = "3"

# Tip rack for Pipette_1 in SINGLE_X1 mode (dedicated single-channel)
[[settings.working_plate]]
type = "tip"
labware_id = "tip_rack_geb_1000ul"
connection = "Pipette_1"
mode = "single_X1"
position_rack = "9"
