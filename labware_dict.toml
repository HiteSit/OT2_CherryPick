# =============================================================================
# Pipette definitions
# Each pipette is a complete table with integrated metadata
#
# NOTE: Labware definitions have been removed from this file.
# Labware is now identified directly by Opentrons load names in settings.toml.
# Calibration offsets are stored per-slot in offset_database.toml.
# =============================================================================

[[pipettes]]
name = "Pipette_8"
opentrons_id = "p300_multi_gen2"
channels = 8
volume_range = [30, 300]
preferred_mount = "right"
tip_connections = ["opentrons_96_tiprack_300ul"]

[[pipettes]]
name = "Pipette_1"
opentrons_id = "p1000_single_gen2"
channels = 1
volume_range = [100, 1000]
preferred_mount = "left"
tip_connections = ["tip_rack_geb_1000ul"]
