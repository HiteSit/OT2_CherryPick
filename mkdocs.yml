site_name: OT2-CherryPick
site_description: Data-driven protocol generation for Opentrons OT-2 cherry-picking workflows.
site_author: Riccardo Fusco
site_url: https://hitesit.github.io/OT2_CherryPick/
repo_url: https://github.com/HiteSit/OT2_CherryPick
repo_name: HiteSit/OT2_CherryPick
copyright: Copyright 2026 Riccardo Fusco

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Overview: index.md
  - Installation: installation.md
  - GUI Guide: gui_guide.md
  - Configuration Reference: configuration_reference.md
  - Liquid Handling Guide: liquid_handling_guide.md
  - MCP Tools Reference: mcp_tools_reference.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - with-pdf:
      enabled_if_env: ENABLE_PDF_EXPORT
      output_path: pdf/OT2-CherryPick-Manual.pdf
      cover_title: OT2-CherryPick
      cover_subtitle: OT-2 protocol generation manual
      toc_title: Contents
      toc_level: 3
      ordered_chapter_level: 2
      author: Riccardo Fusco
      copyright: Copyright 2026 Riccardo Fusco

not_in_nav: |
  imgs/*

strict: false
